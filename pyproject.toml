[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luna"
version = "0.1.1"
description = "High-performance data engineering and analytics platform for Python and SAS transition"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "polars>=0.20.0",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.0.0"]
postgres = ["psycopg[binary]>=3.1.0"]
mysql = ["pymysql>=1.1.0"]
mssql = ["turbodbc>=4.0.0"]
db2 = ["turbodbc>=4.0.0"]
teradata = ["turbodbc>=4.0.0"]
sas = ["pyreadstat>=1.2.0"]
bigquery = ["google-cloud-bigquery>=3.17.0", "google-cloud-bigquery-storage>=2.24.0"]
gcs = ["duckdb>=0.9.0"]
dremio = ["adbc-driver-flightsql>=0.9.0"]
all = [
    "oracledb>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pymysql>=1.1.0",
    "turbodbc>=4.0.0",
    "pyreadstat>=1.2.0",
    "google-cloud-bigquery>=3.17.0",
    "google-cloud-bigquery-storage>=2.24.0",
    "adbc-driver-flightsql>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]